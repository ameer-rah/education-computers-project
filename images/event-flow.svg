<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="880" height="230" fill="#f1f6ed"/>
  <g transform="translate(20 40)">
    <rect width="250" height="150" rx="16" fill="#ffffff" stroke="#c9d7c9" stroke-width="2"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#112722"/>
    <text x="37" y="43" font-size="15" font-weight="700" fill="#b9f377" text-anchor="middle">1</text>
    <text x="20" y="84" font-size="19" font-weight="700" fill="#1b2927">Find the button</text>
    <rect x="14" y="102" width="222" height="32" rx="8" fill="#142722"/>
    <text x="24" y="123" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#d9efda" textLength="180" lengthAdjust="spacingAndGlyphs">querySelector("button")</text>
  </g>
  <g transform="translate(315 40)">
    <rect width="250" height="150" rx="16" fill="#ffffff" stroke="#c9d7c9" stroke-width="2"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#112722"/>
    <text x="37" y="43" font-size="15" font-weight="700" fill="#b9f377" text-anchor="middle">2</text>
    <text x="20" y="84" font-size="19" font-weight="700" fill="#1b2927">Wait for a click</text>
    <rect x="14" y="102" width="222" height="32" rx="8" fill="#142722"/>
    <text x="24" y="123" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#d9efda" textLength="200" lengthAdjust="spacingAndGlyphs">addEventListener("click", …)</text>
  </g>
  <g transform="translate(610 40)">
    <rect width="250" height="150" rx="16" fill="#ffffff" stroke="#c9d7c9" stroke-width="2"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#112722"/>
    <text x="37" y="43" font-size="15" font-weight="700" fill="#b9f377" text-anchor="middle">3</text>
    <text x="20" y="84" font-size="19" font-weight="700" fill="#1b2927">Change the page</text>
    <rect x="14" y="102" width="222" height="32" rx="8" fill="#142722"/>
    <text x="24" y="123" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#d9efda" textLength="202" lengthAdjust="spacingAndGlyphs">textContent = "You clicked me!"</text>
  </g>
  <g fill="none" stroke="#3f7556" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 115h32m-8-8l8 8-8 8"/>
    <path d="M571 115h32m-8-8l8 8-8 8"/>
